<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/brand/gedi-finance-favicon-32.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/gedi-finance-favicon-32.png" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/brand/gedi-finance-favicon-16.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/gedi-finance-favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/gedi-finance-app-icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0E3B2E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gedi Finance</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('gedi-theme')
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          document.documentElement.setAttribute('data-theme', mode)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'system')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
