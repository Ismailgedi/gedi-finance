# Render Blueprint for Gedi Finance (real-user test deployment).
#
# Single-service architecture: one Docker web service running Nginx +
# PHP-FPM serves both the Laravel API and the built React/Vite SPA from
# the same origin (see /Dockerfile - the SPA build lands inside Laravel's
# public/ dir, and Nginx routes /api, /sanctum and /up to PHP-FPM, and
# everything else to static files with an SPA fallback). This matches the
# app's actual auth model: Sanctum's cookie/session SPA auth
# (Auth::guard('web')->login() in AuthController, not bearer tokens),
# which needs the browser to see the API as same-origin - a single
# service avoids the cross-site-cookie problem outright rather than
# needing edge rewrites between two separate services.
#
# The name below (gedi-finance) and the "oregon" region are assumptions -
# see RENDER_DEPLOYMENT.md for how to change them and for the manual
# steps this file can't do on its own (linking the repo, entering secret
# values).

databases:
  - name: gedi-finance-db
    databaseName: gedi_finance
    user: gedi_finance
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: gedi-finance
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_NAME
        value: "Gedi Finance"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generate locally with `php artisan key:generate --show` and paste
      # the resulting base64:... value into the Render dashboard - a
      # blueprint file must never carry the real secret.
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://gedi-finance.onrender.com
      # Same origin as APP_URL by design (single service) - kept explicit
      # because cors.php and Sanctum's stateful-domain check both read it.
      - key: FRONTEND_URL
        value: https://gedi-finance.onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: gedi-finance.onrender.com
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: gedi-finance-db
          property: connectionString
      # Password-reset emails just get logged until a real mailer (e.g.
      # RESEND_API_KEY + MAIL_MAILER=resend, both already supported by
      # this codebase) is configured in the dashboard - see
      # RENDER_DEPLOYMENT.md.
      - key: MAIL_MAILER
        value: log
      # Seeded Super Admin account (see database/seeders/DatabaseSeeder.php).
      # Set real values as secrets before the first deploy - the seeder
      # refuses to run at all if ADMIN_PASSWORD is missing or blank (no
      # fallback password).
      - key: ADMIN_NAME
        value: "Gedi Finance Admin"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
