# Render Blueprint for Gedi Finance (real-user test deployment).
#
# Architecture (matches the actual codebase, not a generic template):
#   - backend/  is a Laravel 13 API using Sanctum's cookie/session SPA auth
#     (not token auth) - the frontend and backend must appear same-origin
#     to the browser for login cookies to work reliably across users and
#     browsers (Safari/Chrome increasingly block third-party cookies on
#     *.onrender.com, which is a public suffix).
#   - frontend/ is a Vite/React SPA that already calls the API with plain
#     relative paths ("/api/...", credentials: 'include') - it has no
#     VITE_API_URL/baseURL concept at all today.
#   - To satisfy both facts without touching app code, the static site
#     rewrites /api/* and /sanctum/* to the backend service at Render's
#     edge, exactly like the local Vite dev proxy does. The browser only
#     ever talks to gedi-finance-web's origin.
#
# Names below (gedi-finance-web/-api/-db) and the "oregon" region are
# assumptions - see RENDER_DEPLOYMENT.md for how to change them and for
# the manual steps this file can't do on its own (linking the repo,
# entering secret values).

databases:
  - name: gedi-finance-db
    databaseName: gedi_finance
    user: gedi_finance
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------------
  # Backend: Laravel API (Docker, since Render has no native PHP runtime)
  # ---------------------------------------------------------------------
  - type: web
    name: gedi-finance-api
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_NAME
        value: "Gedi Finance"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generate locally with `php artisan key:generate --show` and paste
      # the resulting base64:... value into the Render dashboard - a
      # blueprint file must never carry the real secret.
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://gedi-finance-api.onrender.com
      - key: FRONTEND_URL
        value: https://gedi-finance-web.onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: gedi-finance-web.onrender.com
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: gedi-finance-db
          property: connectionString
      # Password-reset emails just get logged until a real mailer (e.g.
      # RESEND_API_KEY + MAIL_MAILER=resend, both already supported by
      # this codebase) is configured in the dashboard - see
      # RENDER_DEPLOYMENT.md.
      - key: MAIL_MAILER
        value: log
      # Seeded Super Admin account (see database/seeders/DatabaseSeeder.php).
      # Set real values as secrets before the first deploy - the app falls
      # back to a well-known dev password if ADMIN_PASSWORD is left unset.
      - key: ADMIN_NAME
        value: "Gedi Finance Admin"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ---------------------------------------------------------------------
  # Frontend: Vite/React SPA (static site)
  # ---------------------------------------------------------------------
  - type: web
    name: gedi-finance-web
    runtime: static
    branch: main
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gedi-finance-api.onrender.com/api/*
      - type: rewrite
        source: /sanctum/*
        destination: https://gedi-finance-api.onrender.com/sanctum/*
      - type: rewrite
        source: /*
        destination: /index.html
